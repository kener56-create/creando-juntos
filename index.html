<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creando Juntos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creando Juntos">
<meta name="theme-color" content="#1f6b6b">
<style>
:root{--bg:#e9f3f0;--card:#fff;--tx:#1c2b2b;--mut:#5b6e6e;--pri:#1f6b6b;--pri2:#d5ebe8;--red:#8a2332;--red2:#f7dfe2;--bd:#b9d4d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201f;--card:#182d2c;--tx:#e6f1ef;--mut:#9db8b4;--pri:#5cc0b8;--pri2:#21403e;--red:#ff8b9a;--red2:#3d1f26;--bd:#2f504d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10201f;--card:#182d2c;--tx:#e6f1ef;--mut:#9db8b4;--pri:#5cc0b8;--pri2:#21403e;--red:#ff8b9a;--red2:#3d1f26;--bd:#2f504d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{background:var(--pri);color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{color:#0b1a19}}
header{border-bottom:4px solid #f48aa8}header small{letter-spacing:.15em;font-size:11px;opacity:.9}header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;font-size:13px;opacity:.9}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav a{flex:1;text-align:center;font-size:11px;color:var(--mut);text-decoration:none;padding:4px 2px;border-radius:8px}
nav a b{display:block;font-size:19px;font-weight:400}
nav a.on{color:var(--pri);background:var(--pri2);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2,.card h3{margin:0 0 8px;font-size:17px;color:var(--pri)}
.grid{display:grid;gap:10px}
.tile{display:block;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;color:var(--tx);text-decoration:none;font-weight:600}
.tile small{display:block;font-weight:400;color:var(--mut);margin-top:2px}
.tile.red{border-color:var(--red);background:var(--red2)}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:10px;margin:0 0 8px;background:var(--card);cursor:pointer}
label.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--pri)}
label.chk.done span{text-decoration:line-through;color:var(--mut)}
.bar{height:10px;background:var(--pri2);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#0b1a19}}
.alert{border-radius:12px;padding:14px;font-weight:600;margin:12px 0}
.ok{background:var(--pri2);color:var(--tx)}
.bad{background:var(--red2);color:var(--red);border:1px solid var(--red)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;width:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0b1a19}}
.btn.sec{background:var(--pri2);color:var(--tx);margin-top:8px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label.l{font-size:13px;color:var(--mut)}
.note{font-size:13px;color:var(--mut)}
.rec{border-left:4px solid var(--pri);padding:8px 10px;margin:0 0 8px;background:var(--card);border-radius:8px}
.rec.al{border-color:var(--red)}
.rec small{color:var(--mut)}
.x{float:right;background:none;border:0;color:var(--red);font-size:18px}
ul{padding-left:20px;margin:6px 0}
.ph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;display:block;margin:0 0 10px;background:#f1d3b8}
.row{display:flex;gap:8px;margin-top:10px}.row .btn,.row label{flex:1;margin:0;text-align:center;padding:10px;font-size:14px}
label.btn{display:block;cursor:pointer}
</style>
</head>
<body>
<header><small>GUÍA RÁPIDA DE ENFERMERÍA</small><h1>Creando Juntos</h1><p>Consulta los pasos en segundos · TENS, estudiantes y cuidadores</p></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var V=[["inicio","🏠","Inicio"],["tipos","🩹","Heridas"],["material","🧰","Material"],["pasos","📋","Pasos"],["alarma","⚠️","Alarma"],["registro","📝","Registro"]];
var TIPOS=[["Abrasión (raspón)","Pérdida superficial de piel, sangrado leve y dolor tipo ardor. Lavar con abundante suero o agua limpia y cubrir."],["Herida cortante","Bordes lineales y limpios. Controlar sangrado con presión directa; si es profunda o no cierra, requiere evaluación médica."],["Herida contusa","Golpe con bordes irregulares y hematoma. Limpiar con cuidado y vigilar edema."],["Herida punzante","Entrada pequeña pero profunda. Alto riesgo de infección; consultar verificación de vacuna antitetánica."],["Quemadura superficial","Enrojecimiento y dolor sin ampollas grandes. Enfriar con agua y proteger. Ampollas extensas o zonas especiales: derivar."]];
var MAT=["Guantes de procedimiento","Suero fisiológico 0,9 %","Gasas estériles","Apósito o cubierta estéril","Tela adhesiva o venda","Tijeras limpias","Bolsa para residuos","Paño o campo limpio"];
var PASOS={"Antes de empezar":["Lavar las manos con agua y jabón (o alcohol gel).","Reunir todo el material y revisar fechas de vencimiento.","Explicar el procedimiento a la persona y acomodarla.","Colocar guantes limpios."],"Limpieza":["Retirar el apósito anterior con suavidad; observar el aspecto.","Irrigar con suero fisiológico, del centro hacia afuera.","Usar gasa nueva en cada pasada; no frotar.","Secar a toques alrededor de la herida.","Observar bordes, color, olor y secreción."],"Finalización":["Cubrir con apósito estéril del tamaño adecuado.","Fijar sin apretar y rotular fecha y hora.","Eliminar residuos y retirar guantes.","Lavar las manos nuevamente.","Registrar la curación y los hallazgos."]};
var SIG=["Enrojecimiento que avanza","Dolor, calor, edema","Exudado purulento","Fiebre > 38 °C"];
var app=document.getElementById("app"),nav=document.getElementById("nav");
var st={mat:{},paso:{},sec:"Antes de empezar",sig:{}};
function $(h){return h}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function view(){var h=(location.hash||"#inicio").slice(1);return V.some(function(v){return v[0]==h})?h:"inicio"}
function render(){var v=view();
nav.innerHTML=V.map(function(x){return '<a href="#'+x[0]+'" class="'+(x[0]==v?"on":"")+'"><b>'+x[1]+'</b>'+x[2]+'</a>'}).join("");
app.innerHTML=R[v]();if(B[v])B[v]();window.scrollTo(0,0)}
var R={},B={};
R.inicio=function(){return '<div class="card"><h2>Guía de curaciones simples</h2><p>Una guía clara, rápida y accesible, disponible desde el celular mediante un código QR.</p><p style="margin:6px 0"><b>Problema:</b> la información suele estar en manuales extensos o no está disponible cuando se necesita.</p><p style="margin:6px 0"><b>Solución:</b> guía visual digital con acceso rápido por QR.</p><p style="margin:6px 0 0"><b>¿Para quién?</b> TENS, estudiantes de salud y cuidadores primarios.</p></div><div class="grid"><a class="tile" href="#tipos">🩹 Tipos de herida<small>Reconoce y actúa</small></a><a class="tile" href="#material">🧰 Material necesario<small>Lista de verificación</small></a><a class="tile" href="#pasos">📋 Paso a paso<small>Antes, limpieza y finalización</small></a><a class="tile red" href="#alarma">⚠️ Signos de alarma<small>¿Hay que derivar?</small></a><a class="tile" href="#registro">📝 Registro<small>Anota cada curación</small></a></div><div class="card" style="margin-top:12px"><h3>Sobre el proyecto</h3><p style="margin:0">Gratuita, actualizable y sin instalar nada: si cambian las normas, se actualiza la guía y el mismo QR sigue funcionando.</p><p class="note" style="margin:8px 0 0">Integrantes: Joel López, Teresa Mariñan y Alicia Carrasco · Transferencias Tecnológicas · CFT de la Región de la Araucanía</p></div><div class="card"><h3>📱 Instalar en el celular</h3><p style="margin:0"><b>iPhone (Safari):</b> Compartir → <b>Añadir a pantalla de inicio</b>.</p><p style="margin:6px 0 0"><b>Android (Chrome):</b> menú ⋮ → <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.</p></div><p class="note" style="margin-top:14px">No contiene datos de pacientes y no reemplaza la indicación médica.</p>'};
function ill(i){var s=['<path d="M45 40q15-12 30-4t35 6q8 14-4 26t-34 8q-22-6-27-36z" fill="#e58a8a"/><circle cx="70" cy="52" r="3" fill="#b8353b"/><circle cx="90" cy="58" r="2.5" fill="#b8353b"/>','<path d="M35 55q25-12 45 0t45-2" stroke="#a52a2a" stroke-width="6" fill="none" stroke-linecap="round"/>','<ellipse cx="80" cy="50" rx="38" ry="26" fill="#8a5aa8" opacity=".75"/><path d="M60 48l12-4 10 8" stroke="#a52a2a" stroke-width="4" fill="none"/>','<circle cx="80" cy="50" r="20" fill="#e58a8a" opacity=".6"/><circle cx="80" cy="50" r="6" fill="#5b1a1a"/>','<ellipse cx="80" cy="50" rx="40" ry="28" fill="#f3b08a"/><ellipse cx="80" cy="50" rx="26" ry="17" fill="#d9534f"/>'];return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100"><rect width="160" height="100" fill="#f1d3b8"/>'+s[i]+'</svg>')}
function gi(i){try{return localStorage.getItem("cj_img"+i)}catch(e){return null}}
R.tipos=function(){return TIPOS.map(function(t,i){return '<div class="card"><img class="ph" id="im'+i+'" alt="'+t[0]+'" src="'+(gi(i)||ill(i))+'"><h3>'+t[0]+'</h3><p style="margin:0">'+t[1]+'</p><div class="row"><label class="btn sec">📷 Cambiar imagen<input type="file" accept="image/*" data-i="'+i+'" hidden></label><button class="btn sec" data-q="'+i+'">Quitar</button></div></div>'}).join("")};
B.tipos=function(){document.querySelectorAll('input[type=file]').forEach(function(f){f.onchange=function(){var i=f.dataset.i,fl=f.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);var u=c.toDataURL("image/jpeg",.75);try{localStorage.setItem("cj_img"+i,u)}catch(e){alert("No se pudo guardar la imagen.")}document.getElementById("im"+i).src=u};im.src=r.result};r.readAsDataURL(fl)}});document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){var i=b.dataset.q;try{localStorage.removeItem("cj_img"+i)}catch(e){}document.getElementById("im"+i).src=ill(i)}})};
R.material=function(){return '<div class="card"><h2>Material necesario</h2><div class="bar"><i id="mb"></i></div><div id="ml"></div><button class="btn sec" id="mr">Reiniciar lista</button></div>'};
B.material=function(){var l=document.getElementById("ml");
function d(){l.innerHTML=MAT.map(function(m,i){return '<label class="chk '+(st.mat[i]?"done":"")+'"><input type="checkbox" data-i="'+i+'" '+(st.mat[i]?"checked":"")+'><span>'+m+'</span></label>'}).join("");
var n=MAT.filter(function(_,i){return st.mat[i]}).length;document.getElementById("mb").style.width=(n/MAT.length*100)+"%";
l.querySelectorAll("input").forEach(function(c){c.onchange=function(){st.mat[c.dataset.i]=c.checked;d()}})}
document.getElementById("mr").onclick=function(){st.mat={};d()};d()};
R.pasos=function(){return '<div class="tabs" id="tb"></div><div class="card"><div class="bar"><i id="pb"></i></div><div id="pl"></div><button class="btn sec" id="pr">Reiniciar esta etapa</button></div>'};
B.pasos=function(){var tb=document.getElementById("tb"),l=document.getElementById("pl");
function d(){tb.innerHTML=Object.keys(PASOS).map(function(k){return '<button class="'+(k==st.sec?"on":"")+'" data-k="'+k+'">'+k+'</button>'}).join("");
var a=PASOS[st.sec];l.innerHTML=a.map(function(m,i){var k=st.sec+i;return '<label class="chk '+(st.paso[k]?"done":"")+'"><input type="checkbox" data-k="'+k+'" '+(st.paso[k]?"checked":"")+'><span><b>'+(i+1)+'.</b> '+m+'</span></label>'}).join("");
var n=a.filter(function(_,i){return st.paso[st.sec+i]}).length;document.getElementById("pb").style.width=(n/a.length*100)+"%";
tb.querySelectorAll("button").forEach(function(b){b.onclick=function(){st.sec=b.dataset.k;d()}});
l.querySelectorAll("input").forEach(function(c){c.onchange=function(){st.paso[c.dataset.k]=c.checked;d()}})}
document.getElementById("pr").onclick=function(){PASOS[st.sec].forEach(function(_,i){delete st.paso[st.sec+i]});d()};d()};
R.alarma=function(){return '<div class="card"><h2>Signos de alarma</h2><p class="note">Marca lo que observas.</p><div id="sl"></div><div id="sr"></div></div>'};
B.alarma=function(){var l=document.getElementById("sl");
function d(){l.innerHTML=SIG.map(function(m,i){return '<label class="chk '+(st.sig[i]?"done":"")+'"><input type="checkbox" data-i="'+i+'" '+(st.sig[i]?"checked":"")+'><span style="text-decoration:none;color:inherit">'+m+'</span></label>'}).join("");
var n=SIG.filter(function(_,i){return st.sig[i]}).length;
document.getElementById("sr").innerHTML=n?'<div class="alert bad">⚠️ Derivar a evaluación médica. Signos presentes: '+n+'.</div>':'<div class="alert ok">Sin signos de alarma marcados. Mantén la observación en cada curación.</div>';
l.querySelectorAll("label").forEach(function(x){x.classList.remove("done")});
l.querySelectorAll("input").forEach(function(c){c.onchange=function(){st.sig[c.dataset.i]=c.checked;d()}})}
d()};
function load(){try{return JSON.parse(localStorage.getItem("cj_reg")||"[]")}catch(e){return[]}}
function save(a){try{localStorage.setItem("cj_reg",JSON.stringify(a))}catch(e){}}
R.registro=function(){return '<div class="card"><h2>Nuevo registro</h2><p class="note">No ingreses nombres ni RUT. Usa un código propio (ej. “C-01”). Se guarda solo en este dispositivo.</p><label class="l">Código de la persona</label><input id="rc" maxlength="20" placeholder="C-01"><label class="l">Tipo de herida</label><select id="rt">'+TIPOS.map(function(t){return '<option>'+t[0]+'</option>'}).join("")+'</select><label class="l">Localización</label><input id="rl" maxlength="40" placeholder="Ej. antebrazo derecho"><label class="l">Aspecto</label><select id="ra"><option>Limpia, sin secreción</option><option>Con secreción serosa</option><option>Con secreción purulenta</option><option>Enrojecida o edematosa</option></select><label class="l">Observaciones</label><textarea id="ro" rows="2" maxlength="200"></textarea><label class="chk"><input type="checkbox" id="rs"><span>Se observaron signos de alarma / derivada</span></label><button class="btn" id="rg">Guardar registro</button></div><div id="rh"></div>'};
B.registro=function(){function d(){var a=load();document.getElementById("rh").innerHTML=a.length?'<h3>Historial ('+a.length+')</h3>'+a.map(function(r,i){return '<div class="rec '+(r.s?"al":"")+'"><button class="x" data-i="'+i+'" aria-label="Eliminar">✕</button><b>'+esc(r.c||"s/c")+'</b> · '+esc(r.t)+'<br>'+esc(r.l||"")+' · '+esc(r.a)+(r.s?' · <b style="color:var(--red)">Derivar</b>':'')+(r.o?'<br>'+esc(r.o):'')+'<br><small>'+esc(r.f)+'</small></div>'}).join("")+'<button class="btn sec" id="rx">Borrar todo</button>':'<p class="note">Aún no hay registros.</p>';
document.querySelectorAll(".x").forEach(function(b){b.onclick=function(){var a=load();a.splice(+b.dataset.i,1);save(a);d()}});
var x=document.getElementById("rx");if(x)x.onclick=function(){if(confirm("¿Borrar todos los registros?")){save([]);d()}}}
document.getElementById("rg").onclick=function(){var a=load();a.unshift({c:rc.value.trim(),t:rt.value,l:rl.value.trim(),a:ra.value,o:ro.value.trim(),s:rs.checked,f:new Date().toLocaleString("es-CL")});save(a);rc.value=rl.value=ro.value="";rs.checked=false;d()};d()};
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
